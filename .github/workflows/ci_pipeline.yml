name: Computational Engineering CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest # GitHub-hosted virtual environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Action to access your code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt # Install necessary libraries

      - name: Run unit tests
        run: pytest tests/ # Execute your test suite
        
