# Modern dependency management


# toml

[project]
name = "tecxmaai"
version = "0.1.0"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

#[project.optional-dependencies]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
]
# Basic GPU extra for standard PyPI packages
gpu = [
    "tensorflow[and-cuda]>=2.18",
]

# Specific hardware extras for PyTorch or JAX
cuda = [
    "torch>=2.9.1",
    "torchvision",
]
rocm = [
    "torch>=2.9.1",
    "torchvision",
]

# Handling Special Repositories (The "Index-URL" Problem)
#you have two primary options:
#Option A: Tool-Specific Configuration (e.g., uv or poetry)

[[tool.uv.index]]
name = "pytorch-cuda"
url = "download.pytorch.org"
explicit = true

[project.optional-dependencies]
cuda = ["torch"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

